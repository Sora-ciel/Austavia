[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "PolyForm-Noncommercial-1.0.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.2", features = [] }
tauri-plugin-log = "2"

# One Austavia at a time on a computer (2026-10-26): launching it again brings
# the open window forward instead of starting a second copy. KDE's session
# restore launched it once per window it had saved, so every restart added
# windows. See run() in src/lib.rs.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# The timer pop-up's input shape on Linux: only its card takes the pointer
# (src/popup_input.rs). The same GTK the window library is built on.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
