apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// A staging build -- ./build_apk.sh --staging, which passes -Pstaging -- is
// the app pointed at the arial-staging project, for trying a pre-release on a
// phone (asked 2026-10-26). It is a different app to Android: its own package,
// its own name, its own storage, so it installs beside the real Austavia and
// can never replace it or touch its folders.
def staging = project.hasProperty('staging')

android {
    namespace "com.sora.austavia"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId staging ? "com.sora.austavia.staging" : "com.sora.austavia"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 48
        versionName "0.8.661"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The name under the icon, here rather than in strings.xml so the
        // staging build can say which one it is.
        resValue "string", "app_name", staging ? "Austavia Staging" : "Austavia"
        resValue "string", "title_activity_main", staging ? "Austavia Staging" : "Austavia"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystoreProperties) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasKeystoreProperties ? signingConfigs.release : null
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // MediaSessionCompat and NotificationCompat.MediaStyle, for the
    // playback notification.
    implementation "androidx.media:media:1.7.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// google-services.json is what tells this build which Firebase Android app it
// is, and Google Sign-In is authorised by that package name together with the
// signing fingerprint. Without the file the plugin is not applied, the app has
// no Android OAuth configuration, and sign-in fails on the device with a status
// code and nothing else.
//
// Capacitor's template only printed a line about push notifications and carried
// on. That is how a release APK was built, signed, published and installed with
// Google Sign-In entirely non-functional, and nothing said so — the one warning
// went into a Gradle log nobody reads, and the build reported success.
//
// A debug build may go without it. A release must not: it is the one that
// reaches somebody else's phone.
//
// A staging build signs in through the staging project's own Android app,
// whose google-services file build_apk.sh --staging swaps in from
// google-services.staging.json. Without one it is built anyway, loudly: it is
// a build for the person testing it, and the rest of it is worth trying even
// before sign-in is set up -- but it says so.
def servicesJSON = file('google-services.json')
if (staging && !file('google-services.staging.json').exists()) {
    println "STAGING BUILD WITHOUT google-services.staging.json: Google Sign-In will not work in it. " +
        "Add an Android app com.sora.austavia.staging to the arial-staging Firebase project and save its file as android/app/google-services.staging.json."
} else if (servicesJSON.exists() && servicesJSON.length() > 0) {
    apply plugin: 'com.google.gms.google-services'
} else {
    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(':app:assembleRelease') || graph.hasTask(':app:bundleRelease')) {
            throw new GradleException(
                'android/app/google-services.json is missing, so Google Sign-In would be dead in this build. ' +
                'Download it from Firebase Console for the com.sora.austavia app and put it in android/app/. ' +
                'It is gitignored, so a fresh clone will not have it.'
            )
        }
    }
    println "google-services.json not found: Google Sign-In and push notifications are disabled in this build."
}


